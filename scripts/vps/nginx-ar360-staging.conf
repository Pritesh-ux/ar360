# AR360 Studio — Nginx reverse proxy for STAGING ONLY (Ubuntu 24)
#
# Install:
#   sudo cp scripts/vps/nginx-ar360-staging.conf /etc/nginx/sites-available/ar360-staging
#   sudo nano /etc/nginx/sites-available/ar360-staging   # set server_name
#   sudo ln -sf /etc/nginx/sites-available/ar360-staging /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: sudo certbot --nginx -d staging.yourdomain.com
#
# Proxies to staging PM2 app on port 3001 (NOT production 3000).

upstream ar360_staging_app {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name staging.yourdomain.com;

    client_max_body_size 2g;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://ar360_staging_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/products/ {
        proxy_pass http://ar360_staging_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2g;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
