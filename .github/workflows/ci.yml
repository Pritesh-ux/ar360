name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          AUTH_SECRET: ci-build-auth-secret-minimum-32-characters
          WORKER_SECRET: ci-build-worker-secret-minimum-32-chars
          MYSQL_HOST: localhost
          MYSQL_DATABASE: arstudio
          SKIP_RUNTIME_DDL: "true"

  smoke:
    runs-on: ubuntu-latest
    needs: build

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: arstudio
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          AUTH_SECRET: ci-smoke-auth-secret-minimum-32-characters
          WORKER_SECRET: ci-smoke-worker-secret-minimum-32-chars
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MYSQL_DATABASE: arstudio
          SKIP_RUNTIME_DDL: "false"
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3099

      - name: Integration smoke
        run: node scripts/ci-smoke.mjs
        env:
          AUTH_SECRET: ci-smoke-auth-secret-minimum-32-characters
          WORKER_SECRET: ci-smoke-worker-secret-minimum-32-chars
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MYSQL_DATABASE: arstudio
          CI_PORT: "3099"
